<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notetaking App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title"><i class="fas fa-sticky-note"></i> Notes</h1>
                <button class="menu-btn" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Note List -->
            <div class="note-list-container" id="noteListContainer">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-clipboard-list"></i>
                    <p>No notes yet</p>
                    <button class="add-note-btn" id="addNoteBtn">
                        <i class="fas fa-plus"></i> Create Note
                    </button>
                </div>
                <div class="note-list" id="noteList">
                    <!-- Notes will be added here dynamically -->
                </div>
            </div>

            <!-- Note Editor -->
            <div class="note-editor-container" id="noteEditorContainer" style="display: none;">
                <div class="editor-header">
                    <button class="back-btn" id="backBtn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h2 class="editor-title" id="editorTitle">Edit Note</h2>
                    <button class="save-btn" id="saveBtn">
                        <i class="fas fa-check"></i>
                    </button>
                </div>
                <div class="editor-content">
                    <input type="text" class="note-title" id="noteTitle" placeholder="Note Title">
                    <textarea class="note-content" id="noteContent" placeholder="Write your note here..."></textarea>
                </div>
                <div class="editor-footer">
                    <span class="timestamp" id="noteTimestamp"></span>
                    <div class="note-actions">
                        <button class="action-btn" id="deleteBtn">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="action-btn" id="archiveBtn">
                            <i class="fas fa-archive"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Floating Action Button -->
        <button class="fab" id="fab">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((error) => {
                        console.log('SW registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
